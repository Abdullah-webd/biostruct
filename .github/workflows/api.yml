name: API

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api.yml", "docker-compose.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml", "docker-compose.yml"]

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        # A replica set is required for change streams. GitHub's service
        # containers cannot take a custom command, so the set is initiated in a
        # step below and clients use directConnection=true.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
          --ulimit nofile=64000:64000
    steps:
      - uses: actions/checkout@v4

      - name: Initiate the replica set
        run: |
          docker exec "$(docker ps -qf ancestor=mongo:7)" mongosh --quiet --eval '
            try { rs.status().ok } catch (e) {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})
            }'
          for i in $(seq 1 30); do
            if docker exec "$(docker ps -qf ancestor=mongo:7)" \
                 mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              echo "replica set is PRIMARY"; exit 0
            fi
            sleep 2
          done
          echo "replica set never became PRIMARY"; exit 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"

      - name: Tests
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
        run: uv run pytest -q

  smoke:
    # Proves the production image boots and serves real HTTP, not just that
    # the tests pass in-process.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose --profile app up -d --build api
      - name: Wait for readiness
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/readyz | grep -q '"status":"ready"'; then
              curl -fsS http://localhost:8000/readyz; echo; exit 0
            fi
            sleep 3
          done
          echo "API never became ready"; docker compose logs api; exit 1
      - name: Smoke test
        run: python3 apps/api/scripts/smoke.py http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs
