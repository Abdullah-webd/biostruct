[project]
name = "biostruct-api"
version = "0.1.0"
description = "Biostruct scientific backend: target discovery, protein design orchestration, candidate ranking."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "motor>=3.6.0,<4",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    # Pinned exactly: Boltz publishes no OpenAPI spec and this SDK is
    # generated, so a minor bump can rename fields. See ARCHITECTURE.md §6.1.
    "boltz-api==0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biostruct"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # assert: used in tests
    "B008",  # function call in default arg: this is how FastAPI Depends works
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]  # hardcoded test passwords are fine
# The verification scripts invent a password and open the URL they are told to;
# both warnings are about untrusted input they do not have.
"scripts/*.py" = ["S105", "S310"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["biostruct"]
mypy_path = "src"
# motor ships no complete stubs
[[tool.mypy.overrides]]
module = ["motor.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live MongoDB replica set (docker compose up -d mongo)",
]
